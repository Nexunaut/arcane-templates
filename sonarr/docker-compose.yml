services:
  sonarr:
    image: linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=568
      - PGID=568
      - TZ=${TZ}
    volumes:
      - "/mnt/ssd/sonarr:/config"
      - "/mnt/storage/downloads:/downloads"
      - "/mnt/storage/media:/media"
    ports:
      - "8989:8989"
    restart: unless-stopped
